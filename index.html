<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#FFD1DC">
    <title>For You</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; text-decoration:none; }
        a { color:inherit; }
        html, body { width:100%; height:100vh; height:100dvh; overflow:hidden; font-family:-apple-system,"PingFang SC","Microsoft YaHei","Source Han Serif SC","Noto Serif CJK SC",serif; user-select:none; }
        #bg { position:fixed; inset:0; background:linear-gradient(135deg,#FFD1DC,#FFE5EC); transition:background 1.5s ease-in-out; z-index:0; will-change:background; }
        #tip { will-change:opacity; }
        #hearts { position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
        .heart { position:absolute; color:rgba(255,107,157,0.35); animation:fall linear forwards; }
        @keyframes fall { 0%{transform:translateY(-10vh) rotate(0);opacity:0} 10%{opacity:1} 90%{opacity:.8} 100%{transform:translateY(110vh) rotate(360deg);opacity:0} }
        #card { position:relative; z-index:2; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; cursor:pointer; }
        #title { position:absolute; top:max(20px,env(safe-area-inset-top)); font-size:13px; color:rgba(0,0,0,.3); letter-spacing:3px; font-weight:300; }
        #deco-heart { font-size:28px; color:rgba(255,107,157,.6); margin-bottom:24px; animation:pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%,100%{transform:scale(1);opacity:.6} 50%{transform:scale(1.15);opacity:.9} }
        #tip { font-size:clamp(1.4rem,6vw,2rem); color:#3A3A3A; text-align:center; line-height:1.8; max-width:85%; font-weight:500; transition:opacity .5s ease; word-break:break-word; }
        #hint { position:absolute; bottom:max(160px,calc(160px + env(safe-area-inset-bottom))); font-size:12px; color:rgba(0,0,0,.25); letter-spacing:1px; animation:blink 3s ease-in-out infinite; }
        @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:.6} }
        .fade-out { opacity:0 !important; }

        /* 播放器 */
        #player { position:absolute; bottom:max(75px,calc(75px + env(safe-area-inset-bottom))); left:50%; transform:translateX(-50%); width:90%; max-width:380px; z-index:3; }
        #player-bar { display:flex; align-items:center; gap:10px; padding:12px 18px; border-radius:50px; background:rgba(255,255,255,.4); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); cursor:pointer; transition:transform .2s,background .3s; }
        #player-bar:active { transform:scale(.97); }
        #play-icon { font-size:18px; color:#555; width:20px; text-align:center; flex-shrink:0; }
        #song-name { flex:1; font-size:14px; color:#444; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        #song-arrow { font-size:12px; color:#888; transition:transform .3s; flex-shrink:0; }
        #song-arrow.open { transform:rotate(180deg); }
        #song-list { display:none; margin-top:6px; padding:8px 0; border-radius:16px; background:rgba(255,255,255,.5); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); max-height:0; overflow:hidden; transition:max-height .3s ease; }
        #song-list.open { display:block; max-height:300px; }
        .song-item { padding:10px 18px; font-size:14px; color:#555; cursor:pointer; transition:background .2s; }
        .song-item:active { background:rgba(255,255,255,.3); }
        .song-item.active { color:#d63384; font-weight:600; }
        .song-item .num { color:#aaa; margin-right:8px; font-size:12px; }

        /* 歌单按钮 */
        #playlist-btn { position:absolute; bottom:max(25px,env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); padding:10px 28px; border:none; border-radius:50px; background:rgba(255,255,255,.25); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); color:#666; font-size:14px; font-family:inherit; display:flex; align-items:center; gap:6px; cursor:pointer; transition:transform .2s; z-index:3; }
        #playlist-btn:active { transform:translateX(-50%) scale(.92); }

        /* 微信引导 */
        #weixin-tip { position:fixed; inset:0; z-index:999; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; text-align:center; color:#fff; flex-direction:column; }
        #weixin-tip p { margin:6px 0; }
        #weixin-tip .arrow { font-size:40px; margin-bottom:20px; animation:bounce 1.5s ease-in-out infinite; }
        @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
        #weixin-tip .dots { font-size:32px; letter-spacing:4px; }
        #weixin-tip .sub { font-size:14px; color:rgba(255,255,255,.6); margin-top:20px; }
    </style>
</head>
<body>
    <div id="bg"></div>
    <div id="hearts"></div>
    <div id="card" onclick="nextTip()">
        <div id="title">FOR YOU</div>
        <div id="deco-heart">&#9829;</div>
        <div id="tip">今天也要元气满满呀</div>
        <div id="hint">点击换一句 &#183; 摇一摇换一句</div>

        <div id="player">
            <div id="player-bar" onclick="togglePlay(event)">
                <span id="play-icon">&#9654;</span>
                <span id="song-name">小宇 - 张震岳</span>
                <span id="song-arrow" onclick="toggleSongList(event)">&#9660;</span>
            </div>
            <div id="song-list"></div>
        </div>

        <a id="playlist-btn" href="qqmusic://qq.com/ui/myTab?p=%7B%22tab%22%3A%22fav%22%7D" onclick="thisevent=event;thisevent.stopPropagation();">
            <span>&#9835;</span> 听我的歌单
        </a>
    </div>

    <div id="weixin-tip" onclick="this.style.display='none'">
        <div class="arrow">&#8679;</div>
        <p>请点击右上角</p>
        <p class="dots">&#183;&#183;&#183;</p>
        <p>选择「在浏览器打开」</p>
        <p class="sub">即可播放音乐</p>
    </div>

    <audio id="audio" preload="auto"></audio>

    <script>
    // ============================================================
    //   歌曲列表（music 文件夹下的 mp3 文件）
    // ============================================================
    const SONGS = [
        { title: '小宇',      artist: '张震岳',   file: 'music/小宇-张震岳.mp3' },
        { title: '花海',      artist: '周杰伦',   file: 'music/花海-周杰伦.mp3' },
        { title: '太聪明',    artist: '陈绮贞',   file: 'music/太聪明-陈绮贞.mp3' },
        { title: '断了的弦',  artist: '周杰伦',   file: 'music/断了的弦-周杰伦.mp3' }
    ];

    // ============================================================
    //   文案生成器（JS 版，移植自 Python，纯前端运行无需服务器）
    // ============================================================
    const TIP = {
        subjects: ['你','宝贝','亲爱的','小可爱','小朋友','笨蛋','傻瓜','猪猪','老公','老婆','我的最爱','心上人','你呀','小傻瓜'],
        careVerbs: ['多喝','记得喝','多吃','记得吃','多晒','早点','别忘记','要','记得','多去','保持','别忘了','一定','多多'],
        careNouns: ['水哦','热水呀','水果','饭饭','太阳','蔬菜','牛奶','肉肉','鸡蛋','零食','维生素','甜品','好吃的','蛋糕'],
        activityVerbs: ['出门','去外面','走走','散步','跑步','运动','逛逛','看看','晒太阳','呼吸新鲜空气'],
        adjectives: ['开心的','快乐的','元气满满的','幸福的','甜甜的','温暖的','轻松的','舒服的','美好的','幸运的','平安的','健康的','顺利的','可爱的'],
        lovePhrases: ['我想你了','我爱你','我喜欢你','我一直在','我会陪你','抱抱你','亲亲你','想和你在一起','好想你','超级爱你','中意你','心里都是你'],
        timeWords: ['今天','明天','每天','今天一整天','这段时间','此刻','现在','未来的日子','以后','一直'],
        wishes: ['梦想成真','顺顺利利','平平安安','健健康康','烦恼都消失','好运连连','心想事成','万事如意','工作顺利','学业进步','被温柔以待','做个好梦','早点休息','早点睡觉','别熬夜','睡个好觉'],
        expectations: ['期待下一次见面','好想马上见到你','想快点见到你','等你回来','想见你','盼着你','期待和你见面','期待和你一起吃饭','期待和你聊天'],
        weather: ['天冷了,多穿衣服','天热了,注意补水','下雨了,记得带伞','刮风了,注意保暖','太阳好大,注意防晒','降温啦,别着凉','今天天气真好','空气很好呀'],
        careQuestions: ['今天过得开心嘛','吃饭了嘛','睡觉了嘛','有没有想我呀','最近好嘛','在忙嘛','累不累呀','饿不饿呀','冷不冷呀','困不困呀'],
        moodParticles: ['哦','呀','呢','啦','喔','哟','噢','哈','喵','呜','嘛','']
    };

    const GRADIENTS = [
        ['#FFD1DC','#FFE5EC'], ['#C7CEEA','#E8EAF6'], ['#C8E6C9','#E8F5E9'],
        ['#E1BEE7','#F3E5F5'], ['#FFF9C4','#FFFDE7'], ['#FFCCBC','#FBE9E7'],
        ['#B2DFDB','#E0F2F1'], ['#F8BBD0','#FCE4EC'], ['#D1C4E9','#EDE7F6'],
        ['#FFCDD2','#FFEBEE']
    ];

    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function weightedRandom(items, weights) {
        const total = weights.reduce((a, b) => a + b, 0);
        let r = Math.random() * total;
        for (let i = 0; i < items.length; i++) { r -= weights[i]; if (r <= 0) return items[i]; }
        return items[items.length - 1];
    }

    function withTone(text) {
        const last = text[text.length - 1];
        if (Math.random() < 0.5 && last && !'哦呀呢啦喔哟噢哈喵呜嘛吗?？!！,，'.includes(last)) {
            return text + pick(TIP.moodParticles);
        }
        return text;
    }

    function cleanAdj(adj) { return adj.endsWith('的') ? adj.slice(0, -1) : adj; }

    const TPL_CARE = () => {
        const verb = pick(TIP.careVerbs);
        let text;
        if (verb === '早点') text = pick(['早点睡觉呀','早点休息呀','早点睡哦','早点休息哦']);
        else if (verb === '多晒') text = '多晒太阳呀';
        else if (['多喝','记得喝'].includes(verb)) text = verb + pick(['水哦','热水呀','牛奶呀','热牛奶哦','温水呀']);
        else if (['多吃','记得吃'].includes(verb)) text = verb + pick(['水果','饭饭','蔬菜','好吃的','肉肉','甜品','蛋糕','鸡蛋']);
        else if (['别忘记','别忘了','记得','要','一定'].includes(verb)) text = pick([verb+'多喝水哦', verb+'记得吃饭', verb+'早点睡觉', verb+'保持好心情', verb+'多吃水果', verb+'出门记得带伞']);
        else if (verb === '多去') text = pick(['多去外面走走呀','多去散步哦','多去晒晒太阳呀','多去逛逛呢']);
        else if (verb === '多多') text = pick(['多多喝水哦','多多吃饭呀','多多休息呢','多多开心呀']);
        else if (verb === '保持') text = '保持' + cleanAdj(pick(TIP.adjectives)) + '的心情';
        else text = verb + pick(TIP.careNouns);
        return withTone(text);
    };

    const TPL_LOVE = () => {
        let text;
        if (Math.random() < 0.4) text = pick(TIP.subjects) + ',' + pick(TIP.lovePhrases);
        else text = pick(TIP.lovePhrases);
        return withTone(text);
    };

    const TPL_WISH = () => {
        const p = Math.floor(Math.random() * 4) + 1;
        let text;
        if (p === 1) text = pick(TIP.timeWords) + '都要' + cleanAdj(pick(TIP.adjectives));
        else if (p === 2) { const w = pick(TIP.wishes); text = !['别','早','睡'].some(c => w.startsWith(c)) ? '愿' + w : w; }
        else if (p === 3) text = pick(TIP.wishes);
        else text = '保持' + cleanAdj(pick(TIP.adjectives)) + '的心情';
        return withTone(text);
    };

    const TPL_EXPECT = () => pick(TIP.expectations);
    const TPL_WEATHER = () => pick(TIP.weather);

    const TPL_QUESTION = () => {
        if (Math.random() < 0.6) return pick(TIP.careQuestions);
        return pick(TIP.subjects) + pick(['还好嘛','开心嘛','顺利嘛','累嘛','想我嘛']);
    };

    const TPL_ACTIVITY = () => {
        let text = pick(TIP.activityVerbs); if (!text.endsWith('呀')) text += '呀';
        if (Math.random() < 0.5) { const s = pick(TIP.subjects); text = !text.includes('多') ? s + ',多' + text : s + ',' + text; }
        return withTone(text);
    };

    function generateTip() {
        const templates = [[TPL_CARE,25],[TPL_LOVE,20],[TPL_WISH,15],[TPL_EXPECT,10],[TPL_WEATHER,10],[TPL_QUESTION,12],[TPL_ACTIVITY,8]];
        const fn = weightedRandom(templates.map(t => t[0]), templates.map(t => t[1]));
        return fn();
    }

    // ============================================================
    //   UI 逻辑 - 文案 + 背景 + 心形粒子
    // ============================================================
    const bg = document.getElementById('bg');
    const tipEl = document.getElementById('tip');
    const heartsContainer = document.getElementById('hearts');
    const AUTO_INTERVAL = 4000;
    let autoTimer = null;

    function nextTip() {
        tipEl.classList.add('fade-out');
        setTimeout(() => {
            tipEl.textContent = generateTip();
            const g = pick(GRADIENTS);
            bg.style.background = `linear-gradient(135deg, ${g[0]}, ${g[1]})`;
            tipEl.classList.remove('fade-out');
        }, 400);
        resetAutoTimer();
    }

    function resetAutoTimer() {
        if (autoTimer) clearInterval(autoTimer);
        autoTimer = setInterval(nextTip, AUTO_INTERVAL);
    }

    function spawnHeart() {
        const h = document.createElement('div');
        h.className = 'heart';
        h.textContent = '\u2665';
        h.style.left = Math.random() * 100 + 'vw';
        h.style.fontSize = (12 + Math.random() * 18) + 'px';
        h.style.animationDuration = (4 + Math.random() * 4) + 's';
        h.style.opacity = 0.2 + Math.random() * 0.4;
        heartsContainer.appendChild(h);
        h.addEventListener('animationend', () => h.remove());
    }
    setInterval(spawnHeart, 1200);

    // 摇一摇
    let shakeThreshold = 18, lastShake = 0, lastX=0, lastY=0, lastZ=0;
    function handleMotion(e) {
        const a = e.accelerationIncludingGravity; if (!a) return;
        const x=a.x||0, y=a.y||0, z=a.z||0;
        const delta = Math.abs(x-lastX)+Math.abs(y-lastY)+Math.abs(z-lastZ);
        lastX=x; lastY=y; lastZ=z;
        const now = Date.now();
        if (delta > shakeThreshold && now - lastShake > 1500) { lastShake = now; nextTip(); }
    }
    function requestMotionPermission() {
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            DeviceMotionEvent.requestPermission().then(s => { if (s === 'granted') window.addEventListener('devicemotion', handleMotion); }).catch(()=>{});
        } else if (typeof DeviceMotionEvent !== 'undefined') {
            window.addEventListener('devicemotion', handleMotion);
        }
    }

    // ============================================================
    //   播放器逻辑
    // ============================================================
    const audio = document.getElementById('audio');
    const playIcon = document.getElementById('play-icon');
    const songName = document.getElementById('song-name');
    const songArrow = document.getElementById('song-arrow');
    const songList = document.getElementById('song-list');
    let currentIdx = 0;
    let isPlaying = false;

    // 渲染歌曲列表
    function renderSongList() {
        songList.innerHTML = SONGS.map((s, i) =>
            `<div class="song-item ${i === currentIdx ? 'active' : ''}" onclick="playSong(${i},event)">
                <span class="num">${String(i+1).padStart(2,'0')}</span>${s.title} - ${s.artist}
            </div>`
        ).join('');
    }

    function loadSong(idx) {
        currentIdx = idx;
        const s = SONGS[idx];
        audio.src = s.file;
        songName.textContent = s.title + ' - ' + s.artist;
        renderSongList();
    }

    function playSong(idx, e) {
        if (e) e.stopPropagation();
        loadSong(idx);
        audio.play().then(() => {
            isPlaying = true;
            playIcon.innerHTML = '&#10074;&#10074;';
        }).catch(() => {});
        if (e) toggleSongList(e, true);
    }

    function togglePlay(e) {
        if (e) e.stopPropagation();
        if (audio.paused) {
            if (!audio.src) loadSong(0);
            audio.play().then(() => {
                isPlaying = true;
                playIcon.innerHTML = '&#10074;&#10074;';
            }).catch(() => {});
        } else {
            audio.pause();
            isPlaying = false;
            playIcon.innerHTML = '&#9654;';
        }
    }

    function toggleSongList(e, forceClose) {
        if (e) e.stopPropagation();
        if (forceClose) {
            songList.classList.remove('open');
            songArrow.classList.remove('open');
        } else {
            songList.classList.toggle('open');
            songArrow.classList.toggle('open');
        }
    }

    // 播放完自动下一首
    audio.addEventListener('ended', () => {
        const next = (currentIdx + 1) % SONGS.length;
        playSong(next);
    });

    // 首次点击页面时自动播放（浏览器策略要求用户交互）
    document.getElementById('card').addEventListener('click', function startPlay() {
        if (!isPlaying && !audio.src) {
            loadSong(Math.floor(Math.random() * SONGS.length));
            audio.play().then(() => {
                isPlaying = true;
                playIcon.innerHTML = '&#10074;&#10074;';
            }).catch(() => {});
        }
        this.removeEventListener('click', startPlay);
        requestMotionPermission();
    }, { once: true });

    // ============================================================
    //   "听我的歌单"按钮：微信引导 + 手机端调起App + 电脑端网页版
    // ============================================================
    function isWeixin() { return /MicroMessenger/i.test(navigator.userAgent); }
    function isMobile() { return /Android|iPhone|iPad|iPod|Mobile|Phone/i.test(navigator.userAgent); }

    const playlistBtn = document.getElementById('playlist-btn');
    if (isWeixin()) {
        playlistBtn.addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('weixin-tip').style.display = 'flex';
        });
    } else if (!isMobile()) {
        playlistBtn.href = 'https://y.qq.com';
        playlistBtn.target = '_blank';
    }

    // 初始化
    loadSong(0);
    renderSongList();
    nextTip();
    </script>
</body>
</html>
